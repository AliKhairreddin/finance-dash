name: Dashboard checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run verify:wise-imports
      - run: bash verification/wise-imports/replay.sh
      - run: npm run verify:dashboard-state
      - run: bash verification/dashboard-state/replay.sh
      - run: npm run verify:codegen
      - run: bash verification/convex-codegen/replay.sh
      - name: Check management report parser version
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash verification/management-report/check.sh "$BASE_COMMIT"
      - run: bash verification/management-report/replay.sh
      - run: npm run verify:statement-retries
      - run: bash verification/statement-retries/replay.sh
